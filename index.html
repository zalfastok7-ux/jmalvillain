<!DOCTYPE html>
<html lang="id">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>jmalvillain.store — Market</title>

	<link rel="stylesheet" href="style.css">
</head>

<body>

	<!-- HEADER -->
	<header class="topbar">

		<a href="index.html" class="logo">
			jmalvillain.store
		</a>

		<span class="page-title">
			MARKET
		</span>

	</header>


	<!-- MARKET HEADER -->
	<main class="market">

		<div class="market-intro">

			<p class="section-label">
				CURATED FINDS
			</p>

			<h1>
				Shop what<br>
				catches your eye.
			</h1>

			<p class="intro-text">
				Selected products worth checking out.
			</p>

		</div>


		<!-- SEARCH -->
		<div class="search-box">

			<span>⌕</span>

			<input
				type="text"
				id="searchInput"
				placeholder="Search products..."
			>

		</div>


		<!-- CATEGORIES -->
		<div class="categories" id="categories">

			<button
				class="category active"
				data-category="all">
				All
			</button>

			<button
				class="category"
				data-category="shirt">
				Shirt
			</button>

			<button
				class="category"
				data-category="pants">
				Pants
			</button>

			<button
				class="category"
				data-category="shoes">
				Shoes
			</button>

			<button
				class="category"
				data-category="accessories">
				Accessories
			</button>

		</div>


		<!-- PRODUCT LIST -->
		<section
			id="productList"
			class="product-grid">
		</section>


		<!-- LOAD MORE -->
		<button
			id="loadMore"
			class="load-more">
			LOAD MORE
		</button>

	</main>


	<!-- BOTTOM NAVIGATION -->

	<nav class="bottom-nav">

		<a
			href="index.html"
			class="bottom-item active">

			<span>⌂</span>
			<small>Market</small>

		</a>


		<a
			href="design.html"
			class="bottom-item">

			<span>✦</span>
			<small>Design</small>

		</a>


		<a
			href="favorites.html"
			class="bottom-item">

			<span>♡</span>
			<small>Favorites</small>

		</a>


		<a
			href="profile.html"
			class="bottom-item">

			<span>●</span>
			<small>Profile</small>

		</a>

	</nav>


	<script src="script.js"></script>

</body>

</html>
